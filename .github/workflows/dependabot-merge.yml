name: Merge tested dependencies
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      # The dedicated merger obeys required checks and starts main CI.
      - uses: actions/create-github-app-token@v3
        id: merger
        with:
          app-id: ${{ secrets.RELEASE_MERGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_MERGER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: legra-ai/github-actions/.github/actions/merge-tested-dependabot@main
        with:
          token: ${{ steps.merger.outputs.token }}
          app-id: ${{ secrets.RELEASE_MERGER_APP_ID }}
